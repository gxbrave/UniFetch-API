services:
  api:
    image: ghcr.io/gxbrave/unifetch-api:latest
    restart: unless-stopped
    init: true
    ports:
      - "8099:8000"
    environment:
      # Required: set your own random password, at least 24 characters.
      API_TOKEN: ""
      # Empty = 8000. If changed, use the same port on the right above.
      CONTAINER_PORT: ""
      # Optional platform Cookies. Empty = no account Cookie.
      DOUYIN_COOKIE: ""
      XIAOHONGSHU_COOKIE: ""
      BILIBILI_COOKIE: ""
      X_COOKIE: ""
      # Optional settings. Empty = use the default.
      PUBLIC_BASE_URL: ""
      TRUST_PROXY_HEADERS: ""
      RETENTION_HOURS: ""
      MAX_PENDING_JOBS: ""
      DATA_DIR: /data
    volumes:
      - media-data:/data
    shm_size: 512mb
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  media-data:
